name: CI

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]
  schedule:
    - cron: 0 0 * * * # once a day

jobs:
  macos:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }} (Darwin)
    strategy:
      matrix:
        # macos-26 is required for an Xcode with a Swift 6.3 toolchain;
        # macos-latest still resolves to macOS 15 (Swift 6.2 at newest)
        os: [macos-26]
        swift: ["6.3"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  linux-glibc:
    name: Swift 6.3 on Ubuntu (Glibc)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  linux-musl:
    name: Swift 6.3 on Ubuntu (Musl)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
    - uses: actions/checkout@v4
    - name: Install Static Linux SDK
      # Musl builds cross-compile through the Static Linux SDK, which must
      # exactly match the toolchain version, so look up this container's
      # release in the swift.org install API and let `swift sdk install`
      # download and checksum-verify the bundle itself.
      run: |
        command -v curl > /dev/null && command -v python3 > /dev/null || (apt-get update -qq && apt-get install -y -qq curl python3)
        TAG="$(swift --version | grep -oE 'swift-[0-9.]+-RELEASE' | head -n 1 || true)"
        test -n "$TAG" || { echo "no release tag in: $(swift --version)"; exit 1; }
        curl -fsSL -o releases.json https://www.swift.org/api/v1/install/releases.json
        python3 -c "import json; releases=json.load(open('releases.json')); release=next(r for r in releases if r.get('tag')=='$TAG'); print(json.dumps(next(p for p in release['platforms'] if p.get('platform')=='static-sdk')))" > static-sdk.json
        echo "swift.org static-sdk record: $(cat static-sdk.json)"
        CHECKSUM="$(python3 -c "import json; print(json.load(open('static-sdk.json'))['checksum'])")"
        for NAME in "${TAG}_static-linux-0.0.1" "${TAG}_static-linux"; do
          URL="https://download.swift.org/${TAG,,}/static-sdk/${TAG}/${NAME}.artifactbundle.tar.gz"
          curl -sfIL -o /dev/null "$URL" && break || URL=""
        done
        test -n "$URL" || { echo "no static SDK bundle found under https://download.swift.org/${TAG,,}/static-sdk/${TAG}/"; exit 1; }
        swift sdk install "$URL" --checksum "$CHECKSUM"
    - name: Build
      run: swift build -v --swift-sdk x86_64-swift-linux-musl
    - name: Run tests
      # The Static Linux SDK ships Swift Testing (though not XCTest), and its
      # fully static binaries run natively on the glibc host.
      run: swift test -v --swift-sdk x86_64-swift-linux-musl

  android:
    name: Swift on Android (emulator)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Enable KVM for the Android emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Build and test on Android
      # Cross-compiles with the Swift Android SDK and runs the test suite in
      # an emulator. Defaults to the latest Swift release (>= 6.3).
      uses: skiptools/swift-android-action@v2

  windows:
    name: Swift 6.3 on Windows (ucrt)
    runs-on: windows-latest
    steps:
    - uses: compnerd/gha-setup-swift@main
      with:
        branch: swift-6.3-release
        tag: 6.3-RELEASE
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
