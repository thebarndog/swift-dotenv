name: CI

on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]
  schedule:
    - cron: 0 0 * * * # once a day

jobs:
  macos:
    name: Swift ${{ matrix.swift }} on ${{ matrix.os }} (Darwin)
    strategy:
      matrix:
        # macos-26 is required for an Xcode with a Swift 6.3 toolchain;
        # macos-latest still resolves to macOS 15 (Swift 6.2 at newest)
        os: [macos-26]
        swift: ["6.3"]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  linux-glibc:
    name: Swift 6.3 on Ubuntu (Glibc)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  linux-musl:
    name: Swift 6.3 on Ubuntu (Musl)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
    - uses: actions/checkout@v4
    - name: Install Static Linux SDK
      # The Static Linux SDK must exactly match the toolchain version, so
      # derive the release tag from the container's own compiler.
      run: |
        command -v curl > /dev/null || (apt-get update -qq && apt-get install -y -qq curl)
        TAG="$(swift --version | grep -oE 'swift-[0-9.]+-RELEASE' | head -n 1)"
        VERSION="${TAG#swift-}"
        VERSION="${VERSION%-RELEASE}"
        curl -fsSL -o static-linux-sdk.tar.gz "https://download.swift.org/swift-${VERSION}-release/static-sdk/${TAG}/${TAG}_static-linux-0.0.1.artifactbundle.tar.gz"
        swift sdk install static-linux-sdk.tar.gz
    - name: Build
      # Build-only: the Static Linux SDK does not ship XCTest, so the test
      # suite can't run against Musl until it migrates to swift-testing.
      run: swift build -v --swift-sdk x86_64-swift-linux-musl

  android:
    name: Swift on Android (emulator)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Enable KVM for the Android emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Build and test on Android
      # Cross-compiles with the Swift Android SDK and runs the test suite in
      # an emulator. Defaults to the latest Swift release (>= 6.3).
      uses: skiptools/swift-android-action@v2

  windows:
    name: Swift 6.3 on Windows (ucrt)
    runs-on: windows-latest
    steps:
    - uses: compnerd/gha-setup-swift@main
      with:
        branch: swift-6.3-release
        tag: 6.3-RELEASE
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
